name: Example Gate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install example verification tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Core runtime regression
        run: go test -race ./...
      - name: Optional standard telemetry regression
        working-directory: telemetry/standard
        run: go test -race ./...
      - run: ./scripts/verify-examples.sh
